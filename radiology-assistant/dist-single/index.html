<!DOCTYPE html>
<html lang="zh-CN" data-theme="female">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>放射学习助手</title>
  <meta name="theme-color" content="#0B1220">
  <style>
/* ============================================================
   放射学习助手 · 高保真原型 styles.css
   深色医学风 · 双主题：female(脉冲红粉) ⇄ male(医疗青绿)  html[data-theme]
   Design Contract: vanilla / pure-static / 移动端 SPA
   ============================================================ */
:root{
  /* 深色医学风 · 女生版：深海军蓝 + 脉冲红粉强调 */
  --cream:#0B1220; --surface:#121A2B; --ink:#E8EEF8; --ink-soft:#8FA1BC; --line:#24304C;
  --rose:#FF7FA2; --rose-soft:#3A2434;
  --grad:linear-gradient(135deg,#FF7FA2 0%,#F59E6B 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,127,162,.16) 0%,rgba(245,158,107,.16) 100%);
  --ok:#35D0A1; --ok-soft:#12372E; --bad:#FF6B6B; --bad-soft:#3A2025; --warn:#F5B46B;
  --ai:#6FA8FF; --ai-soft:#1B2A44; --ai-ink:#9CC0FF;
  --lav:#2A2F4A; --peach:#3A2E22; --mint:#173331;
  --shadow:0 12px 34px -18px rgba(0,0,0,.65);
  --shadow-soft:0 1px 2px rgba(0,0,0,.4),0 12px 32px -20px rgba(0,0,0,.6);
  --shadow-card:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(255,127,162,.35);
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="male"]{
  /* 深色医学风 · 男生版：冷青灰底 + 医疗青绿强调 */
  --cream:#081319; --surface:#0E1D26; --ink:#E4F2F1; --ink-soft:#8FB0B0; --line:#1E343D;
  --rose:#2FE0CE; --rose-soft:#0E2E2C;
  --grad:linear-gradient(135deg,#2FE0CE 0%,#56C4FF 100%);
  --grad-soft:linear-gradient(135deg,rgba(47,224,206,.16) 0%,rgba(86,196,255,.16) 100%);
  --ok:#35D0A1; --ok-soft:#12372E; --bad:#FF6B6B; --bad-soft:#3A2025; --warn:#F5B46B;
  --ai:#6FA8FF; --ai-soft:#16304b; --ai-ink:#9CC0FF;
  --lav:#243047; --peach:#332C1E; --mint:#123029;
  --shadow:0 12px 34px -18px rgba(0,0,0,.6);
  --shadow-soft:0 1px 2px rgba(0,0,0,.38),0 12px 32px -20px rgba(0,0,0,.55);
  --shadow-card:0 1px 2px rgba(0,0,0,.32),0 12px 30px -18px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(47,224,206,.32);
  --fig-stroke:#4FCBD0; --fig-grad-top:#102733; --fig-grad-bot:#0C1C25;
}
[data-theme="female"]{ --fig-stroke:#E98AA6; --fig-grad-top:#1E2A44; --fig-grad-bot:#111826; }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-sans);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 480px at 50% -8%, color-mix(in srgb,var(--rose) 16%,transparent), transparent 65%),
    radial-gradient(700px 420px at 100% 110%, color-mix(in srgb,var(--ai) 12%,transparent), transparent 60%),
    var(--cream);
  background-attachment:fixed}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:transparent;position:relative;padding-top:var(--safe-top);padding-bottom:calc(82px + var(--safe-bottom));}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:16px 18px 12px;background:color-mix(in srgb,var(--cream) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.topbar h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;display:flex;align-items:center;gap:8px;color:var(--ink)}
.topbar h1 svg{width:23px;height:23px;color:var(--rose)}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-weight:400}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.theme-toggle{background:var(--rose-soft);border:none;color:var(--rose);font-weight:700;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
.theme-toggle:active{transform:scale(.94)}
.badge{font-family:var(--font-num);font-size:10px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;opacity:.85}

/* ---------- 视图容器 ---------- */
.view{display:none;padding:16px 16px 24px;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view.active>*{animation:riseIn .34s var(--ease) both}
.view.active>*:nth-child(2){animation-delay:.04s}
.view.active>*:nth-child(3){animation-delay:.08s}
.view.active>*:nth-child(4){animation-delay:.12s}
.view.active>*:nth-child(5){animation-delay:.16s}
.view.active>*:nth-child(6){animation-delay:.20s}
@keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-bottom));z-index:30}
.tab{flex:1;text-align:center;padding:9px 0 8px;cursor:pointer;color:var(--ink-soft);transition:.15s var(--ease);position:relative;background:none;border:none;font-family:inherit}
.tab .ti,.tab .tl{position:relative;z-index:1}
.tab .ti{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;height:24px}
.tab .ti svg{width:22px;height:22px}
.tab .tl{font-size:10px;margin-top:3px;font-weight:600}
.tab.active{color:var(--rose)}
.tab.active .ti svg{color:var(--rose)}
.tab.active::before{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:32px;height:28px;border-radius:50%;background:var(--rose-soft);z-index:0}
.tab:active{transform:scale(.92)}

/* ---------- 通用组件 ---------- */
[data-lucide]{width:20px;height:20px;stroke-width:1.9}
.card{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:16px}
.card-hover{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.card-hover:active{transform:scale(.98)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.16s var(--ease)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(176,88,107,.5)}
[data-theme="male"] .btn-primary{box-shadow:0 8px 18px -8px rgba(14,124,123,.5)}
.btn-ghost{background:var(--rose-soft);color:var(--rose)}
.btn-soft{background:var(--grad-soft);color:var(--rose)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled,.btn.disabled{opacity:.55;pointer-events:none}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:11px}
.btn svg{width:17px;height:17px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.tag b{font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.ai{background:var(--ai-soft);color:var(--ai-ink)}
.tag.rose{background:var(--rose-soft);color:var(--rose)}
.tag.lav{background:var(--lav);color:var(--ink-soft)}
.tag.mint{background:var(--mint);color:var(--ok)}

.divider{height:1px;background:var(--line);margin:14px 0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.muted{color:var(--ink-soft)}
.num{font-family:var(--font-num)}

/* ---------- 首页 ---------- */
.h-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.h-stat{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px 10px;text-align:center}
.h-stat .val{font-family:var(--font-num);font-size:24px;font-weight:800;color:var(--rose)}
.h-stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.h-hero{background:var(--grad);color:#fff;border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden}
.h-hero::after{content:"";position:absolute;right:-24px;top:-24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.h-hero::before{content:"";position:absolute;right:34px;bottom:-40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08)}
.h-hero .date{font-size:12px;opacity:.92}
.h-hero .slogan{font-size:17px;font-weight:800;margin-top:2px}
.h-hero .spark{font-size:12px;opacity:.9;margin-top:6px}
.h-sec-title{font-size:13px;font-weight:800;color:var(--ink);margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
.h-sec-title .more{font-size:12px;font-weight:600;color:var(--ink-soft)}
.h-quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h-quick{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px;cursor:pointer;transition:transform .16s,box-shadow .16s;border:none;text-align:left;font-family:inherit;width:100%}
.h-quick:active{transform:scale(.97)}
.h-quick .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.h-quick .ic svg{width:21px;height:21px}
.h-quick .qt{font-weight:800;font-size:15px;color:var(--ink)}
.h-quick .qd{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.ic-pos{background:var(--peach);color:var(--warn)}
.ic-ai{background:var(--ai-soft);color:var(--ai-ink)}
.ic-quiz{background:var(--rose-soft);color:var(--rose)}
.ic-exam{background:var(--lav);color:#6d5bb0}
.ic-book{background:var(--bad-soft);color:var(--bad)}
.ic-hist{background:var(--mint);color:var(--ok)}
.h-tip{background:var(--grad-soft);border-radius:var(--radius-md);padding:14px 15px;display:flex;gap:11px}
.h-tip svg{color:var(--rose);flex-shrink:0;margin-top:2px}
.h-tip .t{font-size:13px;color:var(--ink);line-height:1.6}

/* ---------- AI 阅片 ---------- */
.mode-switch{display:flex;background:var(--surface);border-radius:13px;padding:4px;gap:4px;box-shadow:var(--shadow-card)}
.mode-switch button{flex:1;border:none;background:transparent;padding:10px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.mode-switch button.on{background:var(--grad);color:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.seg{display:flex;gap:8px}
.seg .seg-btn{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;text-align:center;font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.seg .seg-btn.on{border-color:var(--rose);color:var(--rose);background:var(--rose-soft)}
.field-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 8px;display:block}
.upload-zone{border:1.8px dashed var(--line);border-radius:var(--radius-md);background:var(--surface);padding:22px;text-align:center;cursor:pointer;transition:.16s;min-height:120px;display:flex;align-items:center;justify-content:center}
.upload-zone:active{border-color:var(--rose)}
.upload-zone .uz-svg{width:44px;height:44px;border-radius:14px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;margin:0 auto 9px}
.upload-zone .uz-svg svg{width:22px;height:22px}
.upload-zone .uz-t{font-weight:800;font-size:14.5px}
.upload-zone .uz-d{font-size:12px;color:var(--ink-soft);margin-top:4px}
.thumb-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:76px;height:76px;border-radius:12px;border:1.5px solid var(--line);overflow:hidden;position:relative;background:var(--cream)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.loading-bar{height:4px;border-radius:99px;background:var(--rose-soft);overflow:hidden;margin-top:12px}
.loading-bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--grad);animation:bar 1s infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.report{background:var(--ai-soft);border-radius:var(--radius-md);padding:14px}
.report .r-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ai-ink);font-size:14px}
.report .r-h svg{width:17px;height:17px}
.ai-gate{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--radius-md);padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.ai-gate svg{color:var(--warn);flex-shrink:0;margin-top:2px}
.ai-gate .g-t{font-size:13px;font-weight:700;color:var(--warn)}
.ai-gate .g-d{font-size:12.5px;color:var(--ink-soft);margin-top:2px}

/* Cobb 角测量 */
.cobb{background:#0B0F14;border-radius:var(--radius-lg);overflow:hidden;padding:8px}
.cobb svg{display:block;width:100%;height:auto;min-height:210px}
.cobb-line{stroke:var(--rose);stroke-width:2.5;stroke-linecap:round}
.cobb-anchor{fill:var(--rose)}
.cobb-vertex{fill:#fff}
.cobb-tag{font-family:var(--font-num);font-size:12px;fill:#fff}
.cobb-title{display:flex;align-items:center;gap:7px;color:var(--rose);font-weight:800;font-size:13px;margin-top:8px;padding:0 4px}
.cobb-title svg{width:16px;height:16px;color:var(--rose)}

/* ---------- 判读 ---------- */
.dr-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dr-progress .dp-l{font-size:13px;font-weight:700}
.dr-progress .dp-bar{flex:1;margin:0 12px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.dr-progress .dp-bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .3s var(--ease)}
.dr-progress .dp-count{font-family:var(--font-num);font-size:13px;font-weight:800;color:var(--rose)}
.dr-film{background:linear-gradient(var(--fig-grad-top),var(--fig-grad-bot));border-radius:var(--radius-md);padding:10px;text-align:center;position:relative;border:1px solid var(--line)}
.dr-film svg{width:100%;height:auto;max-height:230px}
.dr-film .film-tag{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.6);padding:3px 8px;border-radius:6px}
.dr-q{margin-top:14px;font-size:15.5px;font-weight:800;line-height:1.5}
.dr-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.14s;line-height:1.5}
.dr-opt:active{transform:scale(.99)}
.dr-opt .k{display:inline-flex;width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink-soft);align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-right:9px}
.dr-opt.selected{border-color:var(--rose);background:var(--rose-soft)}
.dr-opt.selected .k{background:var(--rose);color:#fff}
.dr-opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.dr-opt.correct .k{background:var(--ok);color:#fff}
.dr-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dr-opt.wrong .k{background:var(--bad);color:#fff}
.dr-foot{display:flex;gap:10px;margin-top:16px}
.dr-foot button{flex:1}
.feedback{margin-top:14px;border-radius:var(--radius-md);padding:13px 14px;font-size:13.5px;line-height:1.6;border:1px solid var(--line)}
.feedback.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}
.feedback .fb-t{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px}

/* 折叠面板 */
.collapse{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;margin-top:14px}
.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;cursor:pointer;font-weight:700;font-size:14px}
.collapse-head svg{width:17px;height:17px;transition:transform .2s;color:var(--ink-soft)}
.collapse.open .collapse-head svg{transform:rotate(180deg)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .25s var(--ease)}
.collapse.open .collapse-body{max-height:1600px}
.collapse.inner{padding:14px;border-top:1px solid var(--line);animation:riseIn .25s both}

/* ---------- 练习 ---------- */
.quiz-tabs{display:flex;background:var(--surface);border-radius:13px;padding:4px;gap:4px;box-shadow:var(--shadow-card);overflow-x:auto}
.quiz-tabs::-webkit-scrollbar{display:none}
.quiz-tabs button{flex:none;padding:9px 14px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;white-space:nowrap}
.quiz-tabs button.on{background:var(--grad);color:#fff}
.quiz-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q-chip{display:flex;align-items:center;gap:10px;padding:13px;border-radius:var(--radius-sm);background:var(--surface);box-shadow:var(--shadow-card)}
.q-chip .qc-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-chip .qc-ic svg{width:19px;height:19px}
.q-chip .qc-t{font-size:12px;color:var(--ink-soft)}
.q-chip .qc-v{font-family:var(--font-num);font-size:17px;font-weight:800}
.quiz-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.qtype-tag{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px}
.qtype-tag.single{background:var(--ai-soft);color:var(--ai-ink)}
.qtype-tag.shared{background:var(--lav);color:#6d5bb0}
.qtype-tag.multi{background:var(--peach);color:var(--warn)}
.q-group{background:var(--grad-soft);border-radius:var(--radius-md);padding:12px 14px;font-size:13.5px;color:var(--ink);margin-bottom:12px;line-height:1.6}
.q-round{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.q-stem{font-size:15.5px;font-weight:800;line-height:1.55;margin:10px 0 4px}
.q-subsen{font-size:13.5px;color:var(--ink);line-height:1.6}
.q-explain{background:var(--ai-soft);border-left:3px solid var(--ai);border-radius:8px;padding:11px 13px;font-size:13px;color:var(--ai-ink);line-height:1.65;margin-top:12px}
.exam-desc{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:16px}
.exam-desc .r1{display:flex;align-items:center;justify-content:space-between}
.exam-desc .ed-sub{font-size:14px;font-weight:800}
.exam-desc .ed-meta{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.7}
.exam-sector{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.exam-sector:last-child{border-bottom:none}
.exam-sector .es-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exam-sector .es-ic svg{width:17px;height:17px}
.exam-sector .es-t{font-weight:700;font-size:13.5px}

.book-meta{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-t{font-weight:700;font-size:14.5px}
.list-row .lr-d{font-size:12px;color:var(--ink-soft);margin-top:3px}

/* ---------- 体位 ---------- */
.pos-tabs{display:flex;gap:8px;flex-wrap:wrap}
.pos-tabs button{flex:none;padding:8px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit}

.pos-bubble .p-lbl{font-size:10px;font-weight:700;color:var(--rose);text-align:center;margin-top:2px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pos-cell{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:13px;cursor:pointer;border:none;text-align:left;font-family:inherit}
.pos-cell:active{transform:scale(.97)}
.pos-cell .pc-t{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.pos-cell .pc-t svg{width:16px;height:16px;color:var(--ink-soft)}
.pos-cell .pc-n{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow-card);border:1px solid var(--line)}
.search-box svg{width:18px;height:18px;color:var(--ink-soft)}
.search-box input{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;color:var(--ink)}
.pos-detail-kv{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pos-detail-kv:last-child{border-bottom:none}
.pos-detail-kv .k{flex:0 0 84px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.pos-detail-kv .v{flex:1;font-size:13.5px;line-height:1.6}

/* ---------- 历史 ---------- */
.empty{padding:52px 20px;text-align:center;color:var(--ink-soft)}
.empty .e-ic{width:72px;height:72px;border-radius:24px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .e-ic svg{width:34px;height:34px}
.empty .e-t{font-size:15px;font-weight:700;color:var(--ink)}
.empty .e-d{font-size:12.5px;margin-top:6px;line-height:1.6}
.hist-card{background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px;margin-bottom:12px}
.hist-card .hc-t{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:14.5px}

/* ---------- 我的 ---------- */
.mine-avatar{display:flex;align-items:center;gap:14px;padding:6px 2px}

.mine-avatar .nm{font-weight:800;font-size:17px}
.mine-avatar .sb{font-size:12px;color:var(--ink-soft);margin-top:2px}
.mine-status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mine-status .ms{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);padding:12px 8px;text-align:center}
.mine-status .ms .v{font-family:var(--font-num);font-weight:800;font-size:18px}
.mine-status .ms .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
.mine-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mine-row:last-child{border-bottom:none}
.mine-row .mr-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mine-row .mr-ic svg{width:19px;height:19px}
.mine-row .mr-t{flex:1;font-weight:700;font-size:14.5px}
.mine-row .mr-d{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.mine-row .mr-arrow{color:var(--ink-soft)}
.api-config .ac-field{margin-bottom:12px}
.api-config .ac-l{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none}

.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);cursor:pointer;transition:.2s;border:none;flex-shrink:0}
.switch.on{background:var(--rose)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{left:21px}
.li-row{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid var(--line)}
.li-row:last-child{border-bottom:none}
.li-row .li-t{font-weight:700;font-size:14.5px}
.li-row .li-d{font-size:12px;color:var(--ink-soft);margin-top:3px}

/* ---------- 弹层 / 模态 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,16,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal-mask.center{align-items:center;padding:20px}
.sheet{background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + var(--safe-bottom));animation:sheetUp .28s var(--ease)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font-size:17px;font-weight:800}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft)}
.sheet-close svg{width:16px;height:16px}
.card-btnlist button{display:flex;align-items:center;gap:11px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;margin-top:11px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.card-btnlist button:active{transform:scale(.98)}
.card-btnlist button svg{color:var(--rose);flex-shrink:0}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#E8EDF5;color:#0E1523;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:99;max-width:88vw;text-align:center;box-shadow:0 14px 34px -12px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 通用骨架 ---------- */
.skel{border-radius:10px;background:linear-gradient(90deg,var(--line),var(--cream),var(--line));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.hide{display:none!important}

@media (min-width:520px){ .app{box-shadow:0 0 46px -22px rgba(0,0,0,.3)} }
</style>
</head>

  <script>
/* ============================================================
   放射学习助手 · mock.js —— 单一数据来源

   ============================================================ */
const DB = {

  dailyTip: "💡 肝血管瘤增强「早出晚归」（周边结节向中心填充）；肝癌「快进快出」。",

  /* ---------- 每日一练真题池 ---------- */
  practicePool: [
    {sub:"颅骨", t:"颅骨正位（后前位）标准影像上，最能清晰显示的结构是", o:["蝶鞍","岩骨、内耳道","额窦与眼眶","乳突气房"], a:1, ex:"颅骨后前位时岩骨影落入眼眶下方，蝶鞍与内听道显示相对清晰；侧位才侧重蝶鞍。"},

    {sub:"手", t:"手正位摄片时，为避免软组织显影重叠应做到", o:["手掌平放紧贴胶片","各指自然分开","蟹钳样展开","手呈半握拳"], a:1, ex:"各指自然分离展开，避免指间软组织重叠，利于观察指骨与关节。"},

  /* ---------- 模拟考试：4 科目 ---------- */
  examSubjects: [
    {name:"基础知识", tag:"single", total:1567, count:75, pct:"单选",

        {t:"CT 值单位为", o:["HU","kVp","mAs","mm"], a:0, ex:"CT 值以 Hounsfield 单位（HU）表示，水的 CT 值为 0。"},

  <script>
/* ============================================================
   放射学习助手 · api.js —— API 桩（无真实后端）
   签名/延迟/加载态对齐未来真实接口，替换实现即可接入。
   约定：
     - apiConfig = { textProvider, textModel, textKey, visionProvider, visionModel, visionKey }
       存于 localStorage('rad_api')
     - 未配置密钥 → 返回 { gate:true }（前端弹门禁提示）
   ============================================================ */
const API = (() => {

  function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

  function loadConfig(){
    try { return JSON.parse(localStorage.getItem("rad_api") || "null") || {}; }
    catch(e){ return {}; }
  }
  function saveConfig(c){ try { localStorage.setItem("rad_api", JSON.stringify(c)); }catch(e){} }

  /* 自检：列出文本/视觉两通道配置状态 */
  function checkConnections(){
    const c = loadConfig();
    const text = [c.textProvider, c.textModel, c.textKey].every(Boolean);
    const vis  = [c.visionProvider, c.visionModel, c.visionKey].every(Boolean);
    return {
      text:{ ok:text, provider:c.textProvider||"", model:c.textModel||"", key:!!c.textKey },
      vision:{ ok:vis, provider:c.visionProvider||"", model:c.visionModel||"", key:!!c.visionKey }
    };
  }

  /* 演示用）配置了任一 Key 即放行，返回 canned 回复。
       TODO: 替换为 POST /api/ai/explain
       req: { questionText, options, apiConfig }  resp: { reply }         */
  async function explain(questionText, options){
    await delay(650); // 模拟网络延迟，触发 loading
    const ok = checkConnections().text.ok || checkConnections().vision.ok;
    if(!ok) return { gate:true };
    return { reply: "【AI 详细讲解】" + (qDesc(questionText) + " 结合临床情景分析如下：该题考查" +
      (options||"") + "，核心在把握投照体位与影像判读要点，建议对照教材案例强化记忆。").slice(0,220) };
  }

  /* TODO: 替换为 POST /api/ai/reading（multipart 影像）
       req: { images:[dataURL], modality, apiConfig }  resp: { report, findings }  */
  async function aiReading(images, modality){
    await delay(1200);
    const ok = checkConnections().vision.ok;
    if(!ok) return { gate:true };
    const n = images ? images.length : 0;
    return {
      report: "影像AI分析报告（演示）",
      findings: [
        { label: modality, text: `共接收 ${n} 张${modality}影像，已启用视觉模型通道进行智能分析。` },
        { label: "建议", text: "未检出明确异常征象（演示输出）。震荡与骨密度判读需结合临床；若为筛查建议结合原始DICOM进一步评估。" }
      ]
    };
  }

  function qDesc(t){ return "题干（" + (t||"").slice(0,30) + "…）"; }

  return { loadConfig, saveConfig, checkConnections, explain, aiReading, delay };
})();
</script>

const todayStr = ()=>{
  const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
let QUIZ_STATS = store.get("rad_stats",{total:0,correct:0,streak:1,last:""});
function bumpStreak(){
  const t=todayStr();
  if(QUIZ_STATS.last!==t){
    const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    QUIZ_STATS.streak = (QUIZ_STATS.last===ys) ? QUIZ_STATS.streak+1 : 1;
    QUIZ_STATS.last = t;
  }
}
function saveStats(){ store.set("rad_stats",QUIZ_STATS); }
function rate(){ return QUIZ_STATS.total? Math.round(QUIZ_STATS.correct/QUIZ_STATS.total*100) : 0; }

function getWrong(){ return store.get("rad_wrong_book",[]); }
function addWrong(t){ const w=getWrong(); if(!w.some(x=>x.t===t.t)){ w.push(t); store.set("rad_wrong_book",w); } }

/* 体位「标记已掌握」：兼具收藏 + 学习打卡统计 */
function posTotalCount(){ return Object.values(DB.posAreas).reduce((n,g)=>n+g.pos.length,0); }
function getMastered(){ return store.get("rad_mastered_pos",[]); }
function masteredCount(){ return getMastered().length; }
function isMastered(key){ return getMastered().indexOf(key)>=0; }
function toggleMastered(key){
  const m=getMastered(); const at=m.indexOf(key); const posKey=key;
  if(at>=0){ m.splice(at,1); store.set("rad_mastered_pos",m);
    QUIZ_STATS.total=Math.max(0,QUIZ_STATS.total-1); QUIZ_STATS.correct=Math.max(0,QUIZ_STATS.correct-1); saveStats();
    return false; }
  m.push(posKey); store.set("rad_mastered_pos",m);
  QUIZ_STATS.total++; QUIZ_STATS.correct++; bumpStreak(); saveStats(); // 计入学习统计并打卡
  return true;
}
function todaysDaily(){
  const k="rad_daily_"+todayStr();
  let d = store.get(k,null);
  if(!d){ d={ set:poolShuffle(), idx:0, ans:[], finish:false, correct:0 }; store.set(k,d); }
  return d;
}
function poolShuffle(){ return DB.practicePool.map(x=>x).sort(()=>Math.random()-0.5); }

    ? `<path d="M60 60 c30 -14 120 -12 150 6 c8 5 -6 22 -30 24 c-20 2 -34 -6 -50 -8 c-34 -4 -70 6 -70 6z" fill="#E8E5DF" stroke="#C7BFAe" stroke-width="1"/>`

  return `<svg viewBox="0 0 240 220" focusable="false"><defs><linearGradient id="film" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--fig-grad-top').trim()||'#FFF8FA'}"/><stop offset="1" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--fig-grad-bot').trim()||'#F6E7EA'}"/></linearGradient></defs>
    <g transform="translate(0,10)">${fig}</g></svg>`;
}
function renderDR(){
  const box=$("#view-dr"); box.style.display="block"; box.style.display="";
  const i=S.dr.idx; const c=DB.drCases[i];
  const done = S.dr.judged; const pct = num(done/DR_TOTAL*100);
  const chosen = S.dr.map[i]; const pending = S.dr.pending; const judged = chosen!==undefined;
  const letters=["A","B","C","D","E"];
  // 选项 class：已提交→高亮对错并锁定；未提交→高亮当前选中
  const optCls = idx => judged
    ? (idx===c.a ? "correct" : (idx===chosen ? "wrong" : ""))
    : (idx===pending ? "selected" : "");
  box.innerHTML=`
    <div class="dr-progress">
      <div class="dp-l">骨折判读</div>
      <div class="dp-bar"><i style="width:${pct}%"></i></div>
      <div class="dp-count">${done}/${DR_TOTAL}</div>
    </div>
    <div class="dr-film"><span class="film-tag">DR · ${c.type}</span>${drBoneFilm(c.type)}<div class="muted" style="font-size:11px">${c.part}</div></div>
    <div class="dr-q">第 ${i+1} 例 · ${c.t}</div>
    ${letters.map((k,idx)=>`<button class="dr-opt ${optCls(idx)}" data-o="${idx}" ${judged?'disabled':''}><span class="k">${k}</span>${c.o[idx]}</button>`).join("")}
    <div id="drSubmitArea" class="mt16">${judged
      ? `<button class="btn btn-primary btn-block" disabled>${icon("check")} 已提交</button>`

  (btn=$("#drNext"))&&btn.addEventListener("click",()=>{ if(S.dr.idx<DR_TOTAL-1){ S.dr.pending=undefined; S.dr.idx++; renderDR(); } });

function answerDR(i,o){

function answerDaily(o){
  const d=todaysDaily(); const q=d.set[d.idx];
  if(d.ans[d.idx]!==undefined) return;
  d.ans[d.idx]=o; if(o===q.a)d.correct++; store.set("rad_daily_"+todayStr(),d);

      <div class="fb-t">${o===q.a?icon("check-circle"):icon("x-circle")} ${o===q.a?"正确":"错误"}</div>

function renderExamSetup(B){
  B.innerHTML=`<div class="mt8">

        <div class="es-n">${icon("chevron-right")}</div></div>`).join("")}
    </div>

  let sel=0;
  $$("#quizBody .exam-sector").forEach((el,i)=>el.addEventListener("click",()=>{
    sel=i;
    $$("#quizBody .exam-sector").forEach(x=>x.style.background="");
    el.style.background="var(--grad-soft)";
  }));
  $("#examStart").addEventListener("click",()=>startExam(sel));
}
function buildExam(si){
  const s=DB.examSubjects[si];
  const items=[]; let n=0;
  while(n < Math.min(s.count, 140)){
    if(s.groups){ s.groups.forEach(g=>{ g.items.forEach(it=>{ items.push({t:it.s,o:it.o,a:it.a,qtype:"shared",g:g.g}); n++; }); }); break; }
    const q=s.pool[n % s.pool.length];
    items.push(q.qtype && q.qtype!=="single" ? q : {t:q.t,o:q.o,a:Array.isArray(q.a)?q.a:q.a,qtype:s.tag, multi:Array.isArray(q.a)});
    n++;
  }
  return items;
}
function startExam(si){
  confirmSheet("开始「"+DB.examSubjects[si].name+"」模拟考试？","卷面按所选科目规则组卷，完成后自动收录错题。",()=>{
    S.exam={si, items:buildExam(si), idx:0, correct:0, ans:{}, running:true};
    renderExamItem();
  });
}
function renderExamItem(){
  const B=$("#quizBody"); const e=S.exam; const q=e.items[e.idx];
  if(!q){ return finishExam(); }
  const letters=["A","B","C","D","E"];
  const shared = q.qtype==="shared"||q.g;
  const multi = Array.isArray(q.a);
  B.innerHTML=`<div class="mt8 card">
    <div class="quiz-item-head"><span class="q-round">${DB.examSubjects[e.si].name} · 第 ${e.idx+1}/${e.items.length} 题</span>
      <span class="qtype-tag ${multi?'multi':shared?'shared':'single'}">${multi?"多选":shared?"共用题干":"单选"}</span></div>
    ${q.g?`<div class="q-group">${q.g}</div>`:""}
    <div class="q-stem">${q.t}</div>
    <div id="examOpts">${letters.map((k,i)=>`<button class="dr-opt" data-o="${i}"><span class="k">${k}</span>${q.o[i]}</button>`).join("")}</div>
    <div class="dr-foot"><button class="btn btn-line" id="exPrev" ${e.idx===0?'disabled':''}>上一题</button>
      <button class="btn btn-primary" id="exNext">${e.idx>=e.items.length-1?"交卷":"下一题"}</button></div></div>`;
  const opts=$$("#examOpts .dr-opt");
  const sel=e.ans[e.idx];
  if(sel!==undefined){ opts.forEach(b=>b.disabled=true); if(Array.isArray(sel)){ sel.forEach(x=>opts[x]&&opts[x].classList.add("correct")); } else opts[sel]&&opts[sel].classList.add("correct"); }
  opts.forEach(b=>b.addEventListener("click",()=>{
    const o=+b.dataset.o;
    if(multi){ if(!e.ans[e.idx]) e.ans[e.idx]=[]; const arr=e.ans[e.idx]; const at=arr.indexOf(o); at>=0?arr.splice(at,1):arr.push(o); b.classList.toggle("correct"); b.disabled=true; }
    else { e.ans[e.idx]=o; opts.forEach(x=>x.disabled=true); opts.forEach(x=>{ if(+x.dataset.o===o)x.classList.add("correct"); }); }
    // 多选减少错选风险：允许逐个点，点后即锁定以保持简单
  }));
  $("#exPrev").addEventListener("click",()=>{ if(e.idx>0){e.idx--;renderExamItem();} });
  $("#exNext").addEventListener("click",()=>{
    const a=e.ans[e.idx]; if(a===undefined){ toast(multi?"请选择（可多选）":"请选择一个答案"); return; }
    const right = Array.isArray(q.a) ? arrEq(a,q.a) : a===q.a;
    if(right)e.correct++;
    if(Array.isArray(q.a)&&!right){ addWrong({sub:DB.examSubjects[e.si].name,t:q.t,o:q.o,a:q.a,ex:q.ex||"",multi:true,you:a}); }
    else if(!Array.isArray(q.a)&&!right){ addWrong({sub:DB.examSubjects[e.si].name,t:q.t,o:q.o,a:q.a,ex:q.ex||"",you:a}); }
    e.idx++; renderExamItem();
  });
}
function arrEq(a,b){ if(a.length!==b.length)return false; const s=(x)=>[...x].sort().join(","); return s(a)===s(b); }
function finishExam(){
  const e=S.exam; const s=DB.examSubjects[e.si];
  const total=e.items.length; const right=e.correct;
  const rec={sub:s.name,date:todayStr(),score:right,total,pct:Math.round(right/total*100)};
  const recs=store.get("rad_exam_records",[]); recs.unshift(rec); store.set("rad_exam_records",recs);
  S.exam.running=false;
  $("#quizBody").innerHTML=`<div class="card" style="text-align:center;padding:34px 20px">
    <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:22px;background:var(--grad-soft);color:var(--rose);display:flex;align-items:center;justify-content:center">${icon("check-circle")}</div>

  $("#examAgain").addEventListener("click",()=>{ S.quizTab="exam"; renderQuiz(); });

}

  </div><button class="btn btn-ghost btn-block mt12" id="posAll">查看全部 ${DB.posOrder.length} 个部位</button>`;
  $$("#posBody .pos-bubble").forEach(b=>b.addEventListener("click",()=>openAreaSheet(b.dataset.a)));
  $("#posAll").addEventListener("click",()=>{ S.posTab="all"; renderPosInner(); });
}
function renderPosSearch(q){
  const B=$("#posBody");
  const hits=[];
  DB.posOrder.forEach(a=>DB.posAreas[a].pos.forEach(p=>{ if(p.name.includes(q)) hits.push({a,...p}); }));
  B.innerHTML = hits.length
    ? `<div class="card"><div class="quiz-item-head" style="margin-bottom:4px"><div style="font-weight:800">搜索结果</div><span class="tag rose">${hits.length} 个</span></div></div>`+ hits.map((p,i)=>`<div class="card mt12"><div class="book-item">
        <div class="bi-no" style="background:var(--rose-soft);color:var(--rose)">${i+1}</div>
        <div class="bi-t"><div class="book-meta"><span class="tag rose">${p.a}</span><span class="tag lavender" style="background:var(--peach);color:var(--warn)">标准体位</span></div>
        <div style="font-weight:700;font-size:14px">${p.name}</div><button class="btn btn-sm btn-line mt12" data-open="${p.a}" data-in="${p.i}">查看详情</button></div></div></div>`).join("")
    : `<div class="empty"><div class="e-ic">${icon("search")}</div><div class="e-t">未找到相关体位</div><div class="e-d">换个关键词试试，如「膝关节」「舟骨」「胸部」</div></div>`;
  $$("#posBody [data-open]").forEach(b=>b.addEventListener("click",()=>openPosDetail(b.dataset.open,+b.dataset.in)));
}
function openAreaSheet(area){
  const g=DB.posAreas[area];
  openSheet(`<div class="sheet-head"><h3>${area}</h3><button class="sheet-close" data-x>${icon("x")}</button></div>
    <div class="muted" style="font-size:13px;margin-bottom:10px">${g.pos.length} 个标准体位 · 点按查看详解</div>
    <div class="card-btnlist">${g.pos.map((p,i)=>`<button data-p="${i}"><span style="font-size:18px;color:var(--warn)">${icon("person-standing")}</span> ${p.name} ${isMastered(area+'::'+i)?`<span style="color:var(--ok)">${icon("check-circle")}</span>`:''} <span style="margin-left:auto;color:var(--ink-soft)">${icon("chevron-right")}</span></button>`).join("")}</div>`);
  $$(".sheet [data-p]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.p; openPosDetail(area,i); }));
  bindSheetClose();
}
function openPosDetail(area,i){
  const p=DB.posAreas[area].pos[i];
  const key=area+"::"+i;
  const master=isMastered(key);
  const kv=[["摄影目的",p.aim],["患者体位",p.post],["探测器 / 暗盒",p.det],["中心线",p.cr],["SID",p.sid],["照射野",p.field],["曝光条件",p.expo],["标准影像",p.standard],["常见错误",p.errors]];
  openSheet(`<div class="sheet-head"><h3>${p.name}</h3><button class="sheet-close" data-x>${icon("x")}</button></div>
    <div class="tag rose mb0">${area} · 标准体位</div>
    <div class="mt16">${posDiagram(p.name,area)}</div>
    <div class="mt16 card">
      ${kv.map(([k,v])=>v?`<div class="pos-detail-kv"><div class="k">${k}</div><div class="v">${v}</div></div>`:"").join("")}
    </div>
    <button class="btn btn-block mt16 ${master?'':'btn-primary'}" id="posMaster">${icon(master?"check-circle":"book-open")} ${master?"已掌握（点击取消）":"标记已掌握 · 提交"}</button>`);
  const mk=$("#posMaster");
  if(mk) mk.addEventListener("click",()=>{
    const on=toggleMastered(key);
    mk.innerHTML = on ? icon("check-circle")+" 已掌握（点击取消）" : icon("book-open")+" 标记已掌握 · 提交";
    mk.classList.toggle("btn-primary",!on); mk.classList.toggle("btn-line",on);
    const pm=$(".pos-master"); // 同步顶部已掌握进度
    if(pm) pm.innerHTML = `<span class="tag rose">${icon("check")} 已掌握</span> ${masteredCount()} / ${posTotalCount()} 个标准体位`;
    toast(on ? "已标记「"+p.name+"」，计入学习统计与打卡" : "已取消「"+p.name+"」已掌握");
  });
  bindSheetClose();
}
function posDiagram(name,area){
  // 简洁投照示意图：探测器 + 中心线 + 体位
  return `<svg viewBox="0 0 300 150" style="width:100%;border-radius:16px;background:var(--cream)">
    <rect x="248" y="20" width="6" height="110" rx="3" fill="var(--rose)" opacity=".55"/><text x="258" y="15" font-size="9" fill="var(--ink-soft)">探测器</text>
    <path d="M30 75 L256 75" stroke="var(--rose)" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="120" y="64" font-size="10" fill="var(--ink-soft)">X 射线 · 中心线</text>
    <g transform="translate(40,48)">${bodyGlyph(area)}</g>
    <text x="150" y="140" font-size="9" fill="var(--ink-soft)">${name}</text>
  </svg>`;
}
function bodyGlyph(area){
  return `<svg width="52" height="54" viewBox="0 0 40 44"><g fill="none" stroke="var(--ink-soft)" stroke-width="1.6" stroke-linecap="round"><circle cx="20" cy="7" r="5.2"/><path d="M15 15 h10 M20 12 V18"/><path d="M15 18 l-4 12 M25 18 l4 12"/><path d="M16 30 L12 42 M24 30 L28 42"/></g></svg>`;
}

function renderHisBody(){
  const B=$("#hisBody"); B.innerHTML="";

/* ---------- Theme 切换 ---------- */
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  const male = mode==="male";
  const btn=$("#themeToggle"); if(btn)btn.innerHTML = male?"♀ 女生版":"♂ 男生版";
  const sw=$("#swTheme"); if(sw)sw.classList.toggle("on",male);
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc)mc.setAttribute("content", male?"#081319":"#0B1220");
  try{ localStorage.setItem("rad_theme",male?"male":"female"); }catch(e){}
}
function toggleTheme(sw){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="male"?"female":"male";
  applyTheme(next);
  if(sw)sw.classList.toggle("on",next==="male");
  toast(cur==="male"?"已切换为女生版 🌸 暖粉":"已切换为男生版 🔷 青绿");
}

/* ---------- 弹层 ---------- */
function openSheet(html){
  closeSheet();
  const mask=document.createElement("div");
  mask.className="modal-mask";
  mask.id="sheetMask";
  mask.innerHTML=`<div class="sheet">${html}</div>`;
  mask.addEventListener("click",e=>{ if(e.target===mask) closeSheet(); });
  document.body.appendChild(mask);
}
function closeSheet(){ const m=document.getElementById("sheetMask"); if(m) m.remove(); }
function bindSheetClose(){ const b=document.querySelector("#sheetMask [data-x]"); if(b)b.addEventListener("click",closeSheet); }

/* ---------- 路由 ---------- */
function go(v){
  const map={home:renderHome, ai:renderAI, dr:renderDR, quiz:renderQuiz, pos:renderPos, history:renderHistory, mine:renderMine};
  if(!map[v]) return;
  // 切换视图与导航
  $$(".view").forEach(x=>x.classList.remove("active"));
  $$(".tab").forEach(x=>x.classList.toggle("active",x.dataset.v===v));
  $("#view-"+v).classList.add("active");
  // 渲染内容（其它容器空闲放空）
  $$(".view").forEach(x=>{ if(x.id!=="view-"+v) x.innerHTML=""; });
  map[v]();
}

/* ---------- 初始化 ---------- */
function init(){
  patchStaticIcons();
  $("#themeToggle").addEventListener("click",()=>toggleTheme());
  $$(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.v)));
  // 恢复主题
  const saved = (()=>{ try{ return localStorage.getItem("rad_theme")||"female"; }catch(e){ return "female"; } })();
  applyTheme(saved);
  go("home");
}
document.addEventListener("DOMContentLoaded",init);
})();
</script>

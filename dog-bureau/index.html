<style>
  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）
     ============================================================ */
  :root {
    /* ============================================================
       THEME: 卡通小狗 × 未来时间管理局 —— 深蓝科技感 + 霓虹点缀
       ============================================================ */
    /* ---- 页面与表面 ---- */
    --page-bg: #0b1628;              /* 深邃科技蓝 */
    --surface-card: #142238;         /* 卡片：比页面亮一层 */

    /* ---- 边框 ---- */

    /* ---- 文本层级 ---- */

    --text-secondary: #7e8ba3;       /* 次文本：灰蓝 */

    /* ---- 主色（电青 · 科技感核心） ---- */

    /* ---- 模块色（霓虹点缀 · 活泼可爱） ---- */

    --module-3: #00ff88;             /* 荧光绿 — 运动/连续天数 */
    --module-4: #b86bff;             /* 霓虹紫 — 记账 */

    /* ---- 抽屉（更深的蓝黑） ---- */

    --drawer-bg-top: #0a1628;
    --drawer-text: #e6edf7;
    --drawer-text-mute: rgba(230,237,247,.48);

    --drawer-active: rgba(0,212,255,.14);

    /* ---- 圆角 ---- */
    --radius-control: 10px;
    --radius-tile: 14px;
    --radius-card: 18px;
    --radius-sheet: 24px;

    /* ---- 阴影（暗色主题用发光感） ---- */

    --nav-h: 64px;
  }

  html, body { height: 100%; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 2px 12px; backdrop-filter: blur(16px);
    background: linear-gradient(180deg, rgba(11,22,40,.92), rgba(11,22,40,.6)); }
  .topbar .menu-btn { width: 40px; height: 40px; border: none; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border);

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }

  .greet::before { content:""; position:absolute; inset:0; pointer-events:none;

  .greet::after { content:""; position:absolute; inset:-1px; border-radius: inherit; pointer-events:none;

  .greet > * { position: relative; z-index: 1; }

  .greet h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em;

  .greet p { color: var(--text-secondary); font-size: 13px; margin-top: 7px; }

  /* ---------- overview rings ---------- */
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 20px 6px; margin-top: 14px; }

    text-align:center; transition: transform .12s, border-color .15s, box-shadow .15s; }
  .qbtn:active { transform: scale(.95); border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }

  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  .pin-list { display:flex; flex-direction:column; gap: 8px; }
  .pin { display:flex; align-items:center; gap: 11px; padding: 12px 14px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .pin-ic { width: 32px; height: 32px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }

  .pin-step button { width: 28px; height: 28px; border-radius: var(--radius-control); border: 1px solid var(--border-input);

  .pin-step button:active { background: var(--accent-muted); border-color: var(--accent); }

  /* ---------- record list (inside a module) ---------- */
  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);

  /* module header (finance summary) */

  .hero.has-cover { padding: 0; min-height: 88px; }

  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }

  .hero-bar { height: 5px; border-radius: 999px; background: var(--border); overflow:hidden; margin-top: 10px; }
  .hero-bar i { display:block; height:100%; border-radius:999px; box-shadow: 0 0 10px rgba(0,212,255,.45); }

  .nav .n { display:flex; flex-direction:column; align-items:center; gap: 4px; cursor:pointer; color: var(--text-tertiary); font-size: 10px; font-weight: 500;
    transition: color .2s; }

  .nav .n.active svg { filter: drop-shadow(0 0 4px var(--accent)); }

  /* ---------- quick record buttons ---------- */
  .qbtn { display:flex; flex-direction:column; align-items:center; gap:9px; padding: 15px 6px 12px; border:none; cursor:pointer;
    border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
    text-align:center; transition: transform .12s, border-color .15s, box-shadow .2s; }
  .qbtn:active { transform: scale(.95); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(0,212,255,.25); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card);
    box-shadow: 0 0 8px rgba(0,212,255,.6); }
  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  /* ---------- drawer（时间管理局侧栏） ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); z-index: 40; opacity:0; pointer-events:none; transition: opacity .22s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position: fixed; top:0; bottom:0; left:0; width: 300px; max-width: 84vw; z-index: 50; transform: translateX(-104%);
    transition: transform .28s cubic-bezier(.2,.8,.25,1); overflow-y:auto;
    background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color:var(--drawer-text);
    border-right: 1px solid rgba(0,212,255,.12);
    box-shadow: 4px 0 40px rgba(0,0,0,.5); }
  .drawer.show { transform: translateX(0); }
  .drawer .dh { padding: 30px 22px 20px; display:flex; align-items:center; gap: 14px; position: relative;
    border-bottom: 1px solid rgba(0,212,255,.08); }
  .drawer .dh .brand { position: relative; width: 48px; height: 48px; border-radius: var(--radius-tile); overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); border: 1px solid rgba(0,212,255,.2); cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,212,255,.15), 0 0 20px rgba(0,212,255,.15); }
  .drawer .dh .brand img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drawer .dh .brand .brand-cam { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
    background: rgba(0,0,0,.5); color:var(--drawer-text); transition: opacity .15s; }
  .drawer .dh .brand:active .brand-cam { opacity:1; }
  .drawer .dh h2 { font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #00d4ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .drawer .dh p { font-size: 11px; opacity: .5; margin-top: 3px; letter-spacing: .08em; text-transform: uppercase; }
  .drawer .dclose { position:absolute; top:20px; right:16px; width:34px;height:34px;border-radius:var(--radius-tile); border:none; cursor:pointer;
    background: rgba(255,255,255,.06); color:var(--drawer-text); display:grid; place-items:center;
    transition: all .15s; }
  .drawer .dclose:active { background: rgba(255,255,255,.15); transform: scale(.93); }
  .drawer .dsep { height:1px; background: linear-gradient(90deg, rgba(0,212,255,.2), rgba(0,212,255,0)); margin: 6px 22px 10px; }
  .drawer .ditem { display:flex; align-items:center; gap: 13px; padding: 13px 22px; cursor:pointer; font-size: 15px; font-weight: 500;
    color: rgba(230,237,247,.75); transition: all .15s;
    border-left: 2px solid transparent; }
  .drawer .ditem svg { color: var(--drawer-text-mute); transition: color .15s; }
  .drawer .ditem.active { background: var(--drawer-active); color:var(--drawer-text); font-weight: 700;
    border-left-color: var(--accent);
    box-shadow: inset 0 0 20px rgba(0,212,255,.05); }
  .drawer .ditem.active svg { color:var(--accent); filter: drop-shadow(0 0 4px rgba(0,212,255,.4)); }
  .drawer .ditem:active { background: rgba(0,212,255,.1); }
  .drawer .dfoot { font-size: 11px; opacity:.35; padding: 20px 22px 28px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(6px); z-index: 60;
    display:flex; align-items:flex-end; justify-content:center; animation: fade .18s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background: var(--surface-card); border: 1px solid rgba(0,212,255,.15);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px;
    box-shadow: 0 -20px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(0,212,255,.12);
    animation: up .26s cubic-bezier(.2,.8,.25,1); max-height: 88vh; overflow-y:auto; }
  @keyframes up { from { transform: translateY(30px); opacity:0; } }
  .modal .grab { width: 42px; height: 4px; border-radius:999px;
    background: linear-gradient(90deg, var(--border-input), var(--accent));
    margin: 0 auto 16px; box-shadow: 0 0 6px rgba(0,212,255,.3); }
  .modal h2 { font-size: 19px; font-weight: 800; letter-spacing:-.01em; }
  .modal .sub { color: var(--text-secondary); font-size: 13px; margin: 4px 0 16px; }
  .field { margin-bottom: 13px; }
  .field label { display:block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  input, select, textarea { font-family: var(--font); font-size: 15px; border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    padding: 11px 12px; background: var(--surface-card); color: var(--text); outline:none; width: 100%;
    transition: border-color .15s, box-shadow .15s; }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
  .frow { display:flex; gap: 10px; }
  .frow .field { flex:1; }
  .seg { display:flex; gap: 8px; }
  .seg .opt { flex:1; text-align:center; padding: 10px; border-radius: var(--radius-tile); border: 1px solid var(--border-input);
    cursor:pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    transition: all .15s; }
  .seg .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 16px rgba(0,212,255,.35); }
  .modal-actions { display:flex; align-items:center; gap: 10px; margin-top: 18px; }
  .btn { flex:1; background: linear-gradient(135deg, #00d4ff, #0099cc); color:#06101c; border:none; border-radius: var(--radius-tile); padding: 13px; font-size: 15px; font-weight: 800; cursor:pointer;
    box-shadow: 0 0 0 1px rgba(0,212,255,.4), 0 0 20px rgba(0,212,255,.25), 0 4px 16px rgba(0,0,0,.3);
    transition: all .15s; }
  .btn:active { transform: scale(.97); filter: brightness(1.15); }
  .btn.ghost { flex: 0 0 auto; background: var(--surface-nested); color: var(--text-secondary); border: 1px solid var(--border-input); padding: 13px 20px;
    box-shadow: none; }
  .btn.danger { background: linear-gradient(135deg, #ff4d6d, #cc3a55); color: #fff;
    box-shadow: 0 0 0 1px rgba(255,77,109,.4), 0 0 20px rgba(255,77,109,.25); }
  /* ============ GALAXY MAP — 星系导航 ============ */
  .sec-hint { font-size: 11px; font-weight: 500; color: var(--text-tertiary); letter-spacing: 0; margin-left: 6px; }
  .galaxy { position: relative; height: min(120vw, 416px); margin: 12px -2px 2px; overflow: hidden;
    border-radius: var(--radius-card); border: 1px solid var(--border);
    background:
      radial-gradient(ellipse 60% 46% at 50% 52%, rgba(0,212,255,.13), transparent 62%),
      radial-gradient(ellipse 42% 34% at 16% 12%, rgba(184,107,255,.13), transparent 58%),
      radial-gradient(ellipse 40% 32% at 88% 88%, rgba(255,140,66,.10), transparent 58%),
      linear-gradient(175deg, #071224 0%, #060d1b 58%, #050a15 100%); }
  .galaxy::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.75;
    background-image:
      radial-gradient(1.5px 1.5px at 11% 18%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 27% 62%, #bff, transparent),
      radial-gradient(1px 1px at 44% 26%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 63% 74%, #fff, transparent),
      radial-gradient(1px 1px at 79% 21%, #cff, transparent),
      radial-gradient(1.5px 1.5px at 91% 55%, #fff, transparent),
      radial-gradient(1px 1px at 8% 82%, #fff, transparent),
      radial-gradient(1px 1px at 35% 92%, #bff, transparent),
      radial-gradient(1.5px 1.5px at 55% 8%, #fff, transparent),
      radial-gradient(1px 1px at 68% 44%, #fff, transparent);
    animation: twinkle 6.5s ease-in-out infinite; }
  .galaxy::after { content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 52%, rgba(0,212,255,.10), transparent 38%);
    animation: corePulse 4.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.75} 50%{opacity:.3} }
  @keyframes corePulse { 0%,100%{opacity:.55} 50%{opacity:1} }

  .gx-orbits { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .gx-orbits ellipse { fill:none; stroke: rgba(0,212,255,.14); stroke-width:.7; stroke-dasharray:2 4.5; }

  .gx-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .gx-links line { stroke: rgba(0,212,255,.42); stroke-width:1; stroke-dasharray:2 5;
    animation: flow 3.4s linear infinite; }
  .gx-links line.hot { stroke: rgba(0,255,136,.45); animation-duration:2.6s; }
  @keyframes flow { to { stroke-dashoffset: -14; } }

  .gx-core { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:104px; height:104px; display:grid; place-items:center; background:none; border:none;
    padding:0; cursor:pointer; z-index:4; }
  .gx-core .c-ring { position:absolute; border-radius:50%; border:1px dashed rgba(0,212,255,.4); }
  .gx-core .c-ring.r1 { inset:6px; animation: spin 16s linear infinite; }
  .gx-core .c-ring.r2 { inset:-2px; border-style:solid; border-color: rgba(184,107,255,.22);
    animation: spin 26s linear infinite reverse; }
  .gx-core .c-dot { width:64px; height:64px; border-radius:50%; display:grid; place-items:center;
    /* 核心星球：左上高光 + 右下阴影 + 中心电青底色 */
    background:
      radial-gradient(ellipse 60% 50% at 32% 22%, rgba(180,240,255,.55) 0%, rgba(180,240,255,0) 58%),
      radial-gradient(ellipse 38% 34% at 76% 80%, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 65%),
      radial-gradient(circle at 50% 50%, #1e4568 0%, #0b1f38 55%, #050d1b 100%);
    border:1px solid rgba(0,212,255,.55);
    box-shadow:
      0 0 28px rgba(0,212,255,.45),
      inset -6px -8px 14px rgba(0,0,0,.45),
      inset 5px 6px 12px rgba(255,255,255,.14),
      inset 0 0 20px rgba(0,212,255,.22);
    animation: coreGlow 5s ease-in-out infinite; }
  .gx-core .c-dot svg { filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)) drop-shadow(0 0 4px rgba(0,212,255,.35)); }
  .gx-core .c-lbl { position:absolute; bottom:-16px; font-size:10px; font-weight:700; color: var(--text-secondary);
    letter-spacing:.08em; white-space:nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes coreGlow { 0%,100%{box-shadow:0 0 22px rgba(0,212,255,.35), inset 0 0 16px rgba(0,212,255,.2)}
    50%{box-shadow:0 0 38px rgba(0,212,255,.6), inset 0 0 22px rgba(0,212,255,.32)} }

  .planet { position:absolute; transform:translate(-50%,-50%); width:74px;
    background:none; border:none; padding:0; cursor:pointer; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    perspective: 400px; }
  .pl-orb { position:relative; width:50px; height:50px; border-radius:50%; display:grid; place-items:center;
    color: #fff;
    /* 立体光球：左上高光 + 右下阴影 + 环境光底 */
    background:
      radial-gradient(ellipse 72% 62% at 28% 22%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(ellipse 42% 38% at 78% 82%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 65%),
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 82%, #0b1a2c) 0%, color-mix(in srgb, var(--c) 55%, #050a14) 60%, #050913 100%);
    border:1px solid color-mix(in srgb, var(--c) 38%, transparent);
    box-shadow:
      /* 外层发光 halo */
      0 0 18px color-mix(in srgb, var(--c) 28%, transparent),
      /* 右下投影 —— 最立体的关键 */
      inset -6px -8px 14px rgba(0,0,0,.55),
      /* 左上高光 —— 让球面鼓起来 */
      inset 5px 6px 12px rgba(255,255,255,.12),
      /* 内部中心亮度 */
      inset 0 0 18px color-mix(in srgb, var(--c) 15%, transparent);
    animation: bobY 4.8s ease-in-out infinite; animation-delay: var(--d, 0s);
    transition: transform .18s cubic-bezier(.2,.7,.3,1);
    transform-style: preserve-3d; }
  /* 表面斑点纹理（噪点感）+ 高光微闪 */
  .pl-orb::before { content:""; position:absolute; inset:4px; border-radius:50%;
    background:
      radial-gradient(ellipse 14px 10px at 30% 26%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(ellipse 7px 6px at 62% 70%, color-mix(in srgb, var(--c) 45%, transparent), transparent 60%),
      radial-gradient(ellipse 5px 4px at 75% 38%, rgba(255,255,255,.12), transparent 60%),
      radial-gradient(circle 3px at 18% 60%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%);
    mix-blend-mode: screen; pointer-events:none; }
  /* 大气边缘反射 */
  .pl-orb::after { content:""; position:absolute; inset:-3px; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle at 30% 30%, transparent 52%, color-mix(in srgb, var(--c) 22%, transparent) 70%, transparent 85%);
    animation: haloPulse 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .planet:hover .pl-orb { transform: translateZ(8px) scale(1.06);
    box-shadow:
      0 0 28px color-mix(in srgb, var(--c) 55%, transparent),
      inset -6px -8px 14px rgba(0,0,0,.5),
      inset 5px 6px 12px rgba(255,255,255,.15),
      inset 0 0 22px color-mix(in srgb, var(--c) 22%, transparent); }
  .planet:active .pl-orb { transform: translateZ(-6px) scale(.92); }
  .planet:active { opacity:.85; }
  .pl-halo { position:absolute; inset:-8px; border-radius:50%;
    border:1px solid color-mix(in srgb, var(--c) 26%, transparent);
    animation: haloPulse 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .pl-name { font-size:11px; font-weight:700; color:#eaf4ff; white-space:nowrap;
    text-shadow: 0 1px 6px rgba(3,9,18,.95), 0 0 12px rgba(3,9,18,.9); }
  .pl-sub { font-size:10px; font-weight:700; color: var(--c); line-height:1;
    text-shadow: 0 1px 6px rgba(3,9,18,.95); }
  @keyframes bobY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes haloPulse { 0%,100%{opacity:.35; transform:scale(.92)} 50%{opacity:.9; transform:scale(1.06)} }

  /* ============ WARP — 跃迁动画 ============ */
  .warp { position:fixed; inset:0; z-index:80; pointer-events:none; display:grid; place-items:center;
    background: radial-gradient(circle at 50% 50%, rgba(0,212,255,.28), rgba(3,8,16,.94) 62%);
    animation: warpFade .82s ease-out forwards; }
  .warp .wring { position:absolute; width:36px; height:36px; border-radius:50%;
    border:2px solid rgba(120,240,255,.95);
    box-shadow: 0 0 32px rgba(0,220,255,.75), inset 0 0 24px rgba(0,220,255,.6);
    animation: wring .62s cubic-bezier(.22,.72,.32,1) forwards; }
  .warp .wring.w2 { animation-delay:.09s; border-color: rgba(184,107,255,.8); }
  .warp .streak { position:absolute; left:50%; top:50%; width:2px; height:58px; margin-left:-1px;
    transform-origin: 50% 0; border-radius:2px;
    background: linear-gradient(180deg, transparent, rgba(160,242,255,.95), transparent);
    animation: streak .6s ease-in forwards; animation-delay: var(--sd, 0s); }
  /* 反向跃迁：光环收缩、星条向内聚合 */
  .warp.back {
    background: radial-gradient(circle at 50% 50%, rgba(255,140,66,.22), rgba(3,8,16,.94) 62%);
    animation: warpFadeRev .76s cubic-bezier(.6,.05,.9,.25) forwards; }
  .warp.back .wring { border-color: rgba(255,190,130,.9);
    box-shadow: 0 0 32px rgba(255,140,66,.65), inset 0 0 24px rgba(255,140,66,.5);
    animation: wringRev .58s cubic-bezier(.6,.05,.9,.25) forwards; }
  .warp.back .wring.w2 { animation-delay:.06s; border-color: rgba(255,107,160,.75); }
  .warp.back .streak { background: linear-gradient(180deg, transparent, rgba(255,190,130,.95), transparent);
    animation: streakRev .52s cubic-bezier(.6,.05,.9,.25) forwards; animation-delay: var(--sd, 0s); }
  @keyframes wring { 0%{opacity:.95; transform:scale(.35)} 70%{opacity:.8} 100%{opacity:0; transform:scale(15)} }
  @keyframes wringRev { 0%{opacity:.9; transform:scale(14)} 60%{opacity:.7} 100%{opacity:0; transform:scale(.3)} }
  @keyframes streak { 0%{opacity:0; transform:rotate(var(--a)) translateY(8px) scaleY(.35)}
    55%{opacity:.9} 100%{opacity:0; transform:rotate(var(--a)) translateY(42vh) scaleY(1.7)} }
  @keyframes streakRev { 0%{opacity:0; transform:rotate(var(--a)) translateY(42vh) scaleY(1.7)}
    50%{opacity:.9} 100%{opacity:0; transform:rotate(var(--a)) translateY(6px) scaleY(.25)} }
  @keyframes warpFade { 0%{opacity:0} 14%{opacity:1} 100%{opacity:0} }
  @keyframes warpFadeRev { 0%{opacity:0} 12%{opacity:1} 100%{opacity:0} }

  /* 进入模块世界的入场动画 */
  #screen.to-world { animation: worldIn .52s cubic-bezier(.2,.7,.3,1); }
  #screen.to-home  { animation: galaxyIn .62s cubic-bezier(.2,.7,.3,1); }
  @keyframes worldIn { 0%{opacity:0; transform:scale(.955) translateY(10px)} 100%{opacity:1; transform:none} }
  @keyframes galaxyIn {
    0%{ opacity:0; transform:scale(1.08); filter: blur(4px); }
    100%{ opacity:1; transform:none; filter:none; }
  }

  .link-danger { color: var(--danger); background:none; border:none; font-size: 14px; font-weight: 600; cursor:pointer; }

  /* ---------- ATLAS 解剖图谱 ---------- */
  .atlas-greet { min-height: 116px; padding: 22px 20px; }
  .atlas-badge { position:absolute; right:20px; bottom:20px; z-index:2;
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: rgba(0,212,255,.12); border: 1px solid rgba(0,212,255,.35);
    border-radius: 999px; padding: 5px 12px; }
  .atlas-hero { margin-top:14px; }
  .atlas-hero .hero-v { color: var(--accent); font-size:19px; font-weight:800; }

  .atlas-tools { position: sticky; top: 56px; z-index: 12; padding: 12px 0 10px; margin-top: 12px;
    background: linear-gradient(180deg, var(--page-bg) 70%, transparent); }
  .atlas-search { display:flex; align-items:center; gap:9px; padding: 0 13px;
    background: var(--surface-card); border:1px solid var(--border-input); border-radius: var(--radius-tile); color: var(--text-tertiary); }
  .atlas-search input { border:none !important; background:none !important; padding: 11px 0 !important;
    box-shadow:none !important; font-size: 14px !important; }
  .atlas-chips { display:flex; gap:7px; overflow-x:auto; padding: 10px 0 2px; scrollbar-width:none; }
  .atlas-chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; font-size:12px; font-weight:600; padding: 7px 13px; border-radius:999px; cursor:pointer;
    background: var(--surface-card); border:1px solid var(--border); color: var(--text-secondary);
    transition: all .15s; white-space:nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(0,212,255,.35); }
  .chip:active { transform: scale(.95); }

  .atlas-region { margin-bottom: 22px; }
  .ar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
  .ar-name { font-size:15px; font-weight:800; letter-spacing:-.01em; }
  .ar-count { font-size:12px; color: var(--module-2); font-weight:700; }
  .ar-bar { height:4px; border-radius:999px; background: var(--surface-nested); overflow:hidden; margin-bottom:14px; }
  .ar-bar i { display:block; height:100%; border-radius:999px; background: var(--module-2);
    box-shadow: 0 0 8px rgba(0,212,255,.4); transition: width .25s; }
  .atlas-group { display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color: var(--text-tertiary); font-weight:600; margin: 12px 2px 8px; letter-spacing:.02em; }
  .atlas-group em { font-style:normal; color: var(--text-secondary); }

  .mus { display:flex; align-items:center; gap:11px; padding:11px 13px; margin-bottom:7px; cursor:pointer;
    background: var(--surface-card); border:1px solid var(--border); border-radius: var(--radius-tile);
    transition: transform .12s, border-color .15s, box-shadow .15s; }
  .mus:active { transform: scale(.98); }
  .mus.on { border-color: rgba(0,255,136,.3); box-shadow: 0 0 0 1px rgba(0,255,136,.12); }
  .mus-i { width:28px; height:28px; flex:0 0 auto; border-radius: 8px; display:grid; place-items:center;
    font-size:11px; font-weight:700; color: var(--text-tertiary); background: var(--surface-nested); }

    font-family:var(--font); }

  .cal-cell.on { color:#fff; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell:active { transform: scale(.92); }
  .cal-toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;
    box-shadow:var(--shadow-overlay); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:10px; }
  .cal-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .cal-toast button { background:var(--module-2); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); }
  .cal-foot { margin-top:12px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .cal-foot svg { color:var(--module-3); }

  .hidden { display: none !important; }
</style>
</head>

<script>

   图标用 icon 字段（取自下方 ICONS 图标库，全部为单色线性图标）。
   ============================================================ */
const MUSCLES = [{"i":1,"region":"头颈部","group":"面部表情肌","name":"枕额肌（颅顶肌）","en":"Occipitofrontalis (Epicranius)","origin":"枕骨最上项线。","insert":"眉部皮肤及鼻根。","action":"提眉、使额部出现横纹；向后牵拉头皮。","nerve":"耳后神经及面神经（第Ⅶ对脑神经）颞支。","demo":"抬眉，如：一脸惊讶😳","note":""},{"i":2,"region":"头颈部","group":"面部表情肌","name":"颊肌","en":"Buccinator","origin":"上颌骨与下颌骨的牙槽突、翼突下颌缝。","insert":"口角。","action":"压紧颊部。","nerve":"面神经（第Ⅶ对脑神经）颊支。","demo":"压紧颊部，如：吹蜡烛😛","note":""},{"i":3,"region":"头颈部","group":"面部表情肌","name":"口轮匝肌","en":"Orbicularis Oris","origin":"唇红缘。","insert":"唇部皮肤及筋膜。","action":"闭唇并使唇前突（噘唇）。","nerve":"面神经（第Ⅶ对脑神经）颊支及下颌缘支。","demo":"噘嘴，如：亲吻（非法式）😘","note":""},{"i":4,"region":"头颈部","group":"咀嚼肌","name":"颞肌","en":"Temporalis","origin":"颞窝及颞筋膜。","insert":"下颌骨冠突及下颌支。","action":"上提下颌骨（闭口）并使其后缩。","nerve":"三叉神经下颌支（V3）的颞深前、后神经。","demo":"","note":""},{"i":5,"region":"头颈部","group":"咀嚼肌","name":"咬肌","en":"Masseter","origin":"颧弓下缘。","insert":"下颌支及下颌角外侧面。","action":"上提下颌骨（闭口）；协助下颌骨前伸。","nerve":"咬肌神经（三叉神经下颌支V3）。","demo":"","note":""},{"i":6,"region":"头颈部","group":"咀嚼肌","name":"翼内肌","en":"Medial Pterygoid","origin":"蝶骨翼突外侧板内侧面；上颌结节；腭骨锥突。","insert":"下颌支及下颌角内侧面。","action":"使下颌骨侧移并前伸。","nerve":"翼内肌神经（三叉神经下颌支V3）。","demo":"","note":"校注：原表“作用”未列上提下颌骨。教材（表11-3）中翼内肌是上提下颌骨（闭口）和使下颌向对侧移动的主要肌肉，并协助下颌前伸。"},{"i":7,"region":"头颈部","group":"咀嚼肌","name":"翼外肌","en":"Lateral Pterygoid","origin":"蝶骨翼突外侧板外侧面；蝶骨大翼颞下面及颞下嵴。","insert":"下颌颈。","action":"使下颌骨侧移并前伸。","nerve":"翼外肌神经（三叉神经下颌支V3）。","demo":"","note":"校注：原表“作用”未列下降下颌骨。教材（表11-3）中翼外肌下头是下降下颌骨（张口）、下颌前伸和使下颌向对侧移动的主要肌肉。"},{"i":8,"region":"头颈部","group":"颈前外侧肌群","name":"胸锁乳突肌","en":"Sternocleidomastoid","origin":"胸骨柄前面；锁骨内侧1/3。","insert":"颞骨乳突及枕骨上项线。","action":"屈颈、颈侧屈；使头转向对侧。","nerve":"副神经（第XI对脑神经）；本体感觉纤维来自第2-4颈神经前支（C2-C4）。","demo":"","note":""},{"i":9,"region":"头颈部","group":"颈前外侧肌群","name":"胸骨舌骨肌","en":"Sternohyoid","origin":"锁骨胸骨端及胸骨柄后面。","insert":"舌骨体下缘。","action":"下降舌骨。","nerve":"颈袢（C1-C3），来自颈丛前支。","demo":"","note":""},{"i":10,"region":"头颈部","group":"颈前外侧肌群","name":"前斜角肌","en":"Scalenus Anterio function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  if(m.type==="atlas"){ renderAtlas(key); return; }
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const inc=it.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type==="note"){
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}${extra}
      <div class="sec-title">记录</div>${body}</div>`;
  wireModule(key);
}

function headHero(m, big, label, pct){

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout (原有逻辑)
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${x.amount}</div></div></div>`;
  }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ============================================================
   ATLAS — 肌骨解剖图谱（142 块肌肉 · 按区域/肌群浏览 · 掌握打勾）
   ============================================================ */
let atlasQ = "", atlasRegion = "all", atlasOnlyNew = false;

function atlasLearned(){ return Object.keys(data.__learned||{}).length; }
function atlasIsOn(i){ return !!data.__learned?.[i]; }
function atlasRegions(){
  const map = new Map();
  MUSCLES.forEach(m => map.set(m.region, (map.get(m.region)||0)+1));
  return [...map.entries()];
}

function atlasBodyHTML(){
  const q = atlasQ.trim().toLowerCase();
  const list = MUSCLES.filter(x=>{
    if(atlasRegion!=="all" && x.region!==atlasRegion) return false;
    if(atlasOnlyNew && atlasIsOn(x.i)) return false;
    if(q){
      const hay = (x.name+" "+x.en+" "+x.group).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(!list.length){
    return `<div class="empty"><span class="e">${icon("target",26)}</span><div>没有匹配的肌肉，换个关键词试试</div></div>`;
  }
  const byRegion = new Map();
  list.forEach(x=>{
    if(!byRegion.has(x.region)) byRegion.set(x.region, new Map());
    const g = byRegion.get(x.region);
    if(!g.has(x.group)) g.set(x.group, []);
    g.get(x.group).push(x);
  });
  let out = "";
  for(const [region, groups] of byRegion){
    const rAll = MUSCLES.filter(x=>x.region===region);
    const rDone = rAll.filter(x=>atlasIsOn(x.i)).length;
    const rPct = rAll.length ? Math.round(rDone/rAll.length*100) : 0;
    out += `<div class="atlas-region">
      <div class="ar-head"><span class="ar-name">${esc(region)}</span>
        <span class="ar-count">${rDone}/${rAll.length}</span></div>
      <div class="ar-bar"><i style="width:${rPct}%"></i></div>`;
    for(const [group, items] of groups){
      const gDone = items.filter(x=>atlasIsOn(x.i)).length;
      out += `<div class="atlas-group">
        <span>${esc(group)}</span><em>${gDone}/${items.length}</em></div>`;
      items.forEach(x=>{
        const on = atlasIsOn(x.i);
        out += `<div class="mus ${on?'on':''}" data-mus="${x.i}">
          <div class="mus-i">${x.i}</div>
          <div class="mus-t">
            <div class="mus-n">${esc(x.name)}</div>
            <div class="mus-e">${esc(x.en)}</div>
          </div>
          <button class="mus-chk" data-learn="${x.i}" aria-label="标记掌握">${icon("check",15,2.6)}</button>
        </div>`;
      });
    }
    out += `</div>`;
  }
  return out;
}

  const m = modOf(key);
  const total = MUSCLES.length, learned = atlasLearned();

  $("#screen").innerHTML = `
    <div class="greet atlas-greet">
      <div><h1>肌骨解剖</h1><p>肌肉篇 · 142 块肌肉 · 起点 / 止点 / 作用 / 神经支配</p></div>
      <div class="atlas-badge">${atlasLearned()}/${total}</div>
    </div>
    <div class="hero atlas-hero">
      <div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
      <div style="flex:1;min-width:0">
        <div class="hero-tx"><span class="hero-v">${pct}%</span><span class="hero-l">已掌握 ${learned} / ${total} 块</span></div>
        <div class="hero-bar"><i style="width:${pct}%;background:${m.color}"></i></div>
      </div>
    </div>
    <div class="atlas-tools">
      <div class="atlas-search">${icon("search",16)}
        <input id="atlas-q" placeholder="搜肌肉名 / 英文名 / 肌群" value="${attr(atlasQ)}" autocomplete="off"/>
      </div>
      <div class="atlas-chips">${chips}
        <button class="chip ${atlasOnlyNew?'on':''}" id="atlas-only-new">未掌握</button>
      </div>
    </div>
    <div id="atlas-body">${atlasBodyHTML()}</div>`;
  wireAtlas(key);
}

function wireAtlas(key){
  const q = $("#atlas-q");
  if(q){
    q.oninput = e => { atlasQ = e.target.value; $("#atlas-body").innerHTML = atlasBodyHTML(); wireAtlasBody(); };
    // 阻止 iOS 键盘顶起时的滚动跳动
    q.onfocus = () => { atlasQ = q.value; };
  }
  $("#screen").querySelectorAll(".atlas-chips .chip[data-reg]").forEach(el=>{
    el.onclick = () => {
      atlasRegion = el.dataset.reg;
      $("#screen").querySelectorAll(".atlas-chips .chip[data-reg]").forEach(c=>c.classList.toggle("on", c.dataset.reg===atlasRegion));
      $("#atlas-body").innerHTML = atlasBodyHTML(); wireAtlasBody();
    };
  });
  const onlyNew = $("#atlas-only-new");
  if(onlyNew) onlyNew.onclick = () => {
    atlasOnlyNew = !atlasOnlyNew;
    onlyNew.classList.toggle("on", atlasOnlyNew);
    $("#atlas-body").innerHTML = atlasBodyHTML(); wireAtlasBody();
  };
  wireAtlasBody();
}

function wireAtlasBody(){
  document.querySelectorAll("#atlas-body .mus").forEach(el=>{
    el.onclick = () => openMuscle(+el.dataset.mus);
  });
  document.querySelectorAll("#atlas-body .mus-chk").forEach(el=>{
    el.onclick = e => { e.stopPropagation(); toggleLearned(+el.dataset.learn); };
  });
}

function toggleLearned(i){
  if(!data.__learned) data.__learned = {};
  if(data.__learned[i]) delete data.__learned[i]; else data.__learned[i] = true;
  persist();
}

function openMuscle(i){
  const x = MUSCLES.find(m=>m.i===i);
  if(!x) return;
  const on = atlasIsOn(i);
  const rows = [
    ["英文名", x.en],
    ["区域 / 肌群", `${x.region} · ${x.group}`],
    ["起点", x.origin],
    ["止点", x.insert],
    ["作用", x.action],
    ["神经支配", x.nerve],
    ["功能动作", x.demo],
    ["校注 / 译注", x.note],
  ].filter(([,v])=>v && String(v).trim());

  const overlay = document.createElement("div"); overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal mus-detail">
    <div class="grab"></div>
    <div class="md-head">
      <div class="md-no">#${x.i}</div>
      <div style="flex:1;min-width:0">
        <h2>${esc(x.name)}</h2>
        <div class="md-en">${esc(x.en)}</div>
      </div>
      <div class="md-state ${on?'on':''}">${on?'已掌握':'未掌握'}</div>
    </div>
    ${rows.map(([k,v])=>`<div class="md-row"><div class="md-k">${k}</div><div class="md-v">${esc(v)}</div></div>`).join("")}
    <div class="modal-actions">
      <button class="btn ghost" id="md-close">关闭</button>
      <button class="btn ${on?'danger':''}" id="md-toggle">${on?'取消掌握':'标记已掌握'}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if(e.target === overlay) close(); };
  overlay.querySelector("#md-close").onclick = close;
  overlay.querySelector("#md-toggle").onclick = () => { close(); toggleLearned(i); };
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key, item){
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;

  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / nav ---------- */
function go(v, opts={}){
  view=v; closeDrawer(); render(); window.scrollTo({top:0});
  const s=$("#screen");
  s.classList.remove("to-world","to-home"); void s.offsetWidth;
  if(v!=="home") s.classList.add("to-world");
  else if(opts._fromWarpBack) s.classList.add("to-home");
}

/* 跃迁：方向 forward = 放大进入新世界；方向 back = 收缩返回星系 */
let warping=false;
function warpTo(key, dir="forward"){
  if(warping || (dir==="forward" && view===key)) return;
  if(dir==="back" && view==="home") return;
  warping=true;
  const back = dir==="back";
  const o=document.createElement("div"); o.className="warp"+(back?" back":"");
  let st="";
  for(let i=0;i<18;i++) st+=`<i class="streak" style="--a:${i*20}deg;--sd:${(i%4)*0.038}s"></i>`;
  o.innerHTML=`<div class="wring"></div><div class="wring w2"></div>${st}`;
  document.body.appendChild(o);
  setTimeout(()=>{
    if(back) go("home",{_fromWarpBack:true});
    else go(key);
  }, back?320:360);
  setTimeout(()=>{ o.remove(); warping=false; }, 900);
}

/* 页面跳转统一走 warpTo —— 从非首页走“正向跃迁”，从非首页→首页走“反向跃迁” */
function navGo(key){
  if(view===key) return;
  if(view!=="home" && key==="home") warpTo(key,"back");
  else warpTo(key,"forward");
}

function render(){
  // 每个模块 = 一个独立“世界”，换一层环境光
  const wm = (view==="home"||view==="insight") ? null : modOf(view);
  document.documentElement.style.setProperty(
    "--world",
    wm ? `color-mix(in srgb, ${wm.color} 17%, transparent)` : "rgba(0,212,255,.09)"
  );
  // top title
  if(view==="home"){ $("#topTitle").firstChild.textContent="我的工作台"; $("#topSub").textContent=CONFIG.slogan; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="洞察"; $("#topSub").textContent="统计与复盘"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:"我的工作台"; $("#topSub").textContent=m?m.desc:""; }
  // nav active
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  // render body
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}洞察</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>navGo(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else navGo(t);
});

/* ---------- avatar upload ---------- */
$("#brandCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#brandImg").src = data.__avatar;
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

buildDrawer();
render();
</script>
</body>
</html>
